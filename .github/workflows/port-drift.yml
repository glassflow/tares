# A bash change to a ported crew command must carry the Python change (TR-1065, scripts/check_port_drift.py).
# Its own workflow so adding or removing the port-drift-ok label re-runs it (ci.yml does not run on labels).
name: port-drift

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: port-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  port-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The labels go in through the environment, never into the command line (a label name is free text).
      - name: Ported bash functions changed without their Python
        env:
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_port_drift.py "$BASE" HEAD --labels "$LABELS"
