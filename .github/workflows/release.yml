# Cut a release by pushing a version tag (e.g. `v0.1.2`):
#   - build the wheel + sdist (with the console bundled)
#   - publish to PyPI via Trusted Publishing (OIDC — no API token needed)
#   - create a GitHub Release with the artifacts and generated notes
#
# One-time PyPI setup (Trusted Publishing): on pypi.org add a publisher for this repo —
#   Owner: glassflow · Repository: navflow · Workflow: release.yml · Environment: pypi
# (Before the first release the project won't exist yet, so add it as a *pending* publisher.)
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The version without the leading v
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag must match the version in pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$TAG  pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG does not match pyproject version $PKG"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the console
        run: npm ci && npm run build
        working-directory: ui

      - uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC → PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.38.0-rc.1: a pre-release, never shown as the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # Publish ai.glassflow/tares to the official MCP registry. Not for -rc.N tags. After pypi: the
  # registry checks that the PyPI release exists and that its README carries the mcp-name line.
  # Needs the MCP_REGISTRY_KEY secret, the ai.glassflow signing key (proved by the DNS TXT record
  # on glassflow.ai; the same key publishes ai.glassflow/rius). Skipped with a warning without it.
  mcp-registry:
    needs: [build, pypi]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY != '' }}
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Warn when MCP_REGISTRY_KEY is missing
        if: env.HAS_MCP_REGISTRY_KEY != 'true'
        run: echo "::warning::MCP_REGISTRY_KEY not configured, skipping the MCP registry publish"
      - uses: actions/checkout@v4
        if: env.HAS_MCP_REGISTRY_KEY == 'true'
      - name: Install mcp-publisher
        if: env.HAS_MCP_REGISTRY_KEY == 'true'
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Set the version from the tag
        if: env.HAS_MCP_REGISTRY_KEY == 'true'
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          ./mcp-publisher validate server.json
      - name: Publish
        if: env.HAS_MCP_REGISTRY_KEY == 'true'
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          published() {
            curl -sSf "https://registry.modelcontextprotocol.io/v0.1/servers/ai.glassflow%2Ftares/versions/${VERSION}" > /dev/null 2>&1
          }
          if published; then
            echo "ai.glassflow/tares ${VERSION} is already published"
            exit 0
          fi
          ./mcp-publisher login dns --domain glassflow.ai --private-key "$MCP_REGISTRY_KEY"
          # PyPI can take a minute to serve a release it just accepted, and the registry checks it.
          # Each retry first checks the registry, in case a failed attempt was in fact accepted.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ] && published; then
              echo "ai.glassflow/tares ${VERSION} is published"
              exit 0
            fi
            ./mcp-publisher publish server.json && exit 0
            echo "publish attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          exit 1

  # Point the Homebrew tap at a final release and check the install. Not for -rc.N tags.
  # Needs the HOMEBREW_TAP_TOKEN repo secret (see homebrew.yml).
  homebrew:
    needs: [build, pypi]
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
