# Cut a release by pushing a version tag (e.g. `v0.1.2`):
#   - build the wheel + sdist (with the console bundled)
#   - publish to PyPI via Trusted Publishing (OIDC — no API token needed)
#   - create a GitHub Release with the artifacts and generated notes
#
# One-time PyPI setup (Trusted Publishing): on pypi.org add a publisher for this repo —
#   Owner: glassflow · Repository: navflow · Workflow: release.yml · Environment: pypi
# (Before the first release the project won't exist yet, so add it as a *pending* publisher.)
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$TAG  pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG does not match pyproject version $PKG"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the console
        run: npm ci && npm run build
        working-directory: ui

      - uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC → PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.38.0-rc.1: a pre-release, never shown as the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
