# The crew tests and the parity harness on Windows, from the first milestone (TR-1066). Its own workflow, so ci.yml
# stays as it is.
# One run of everything took longer than the 60 minute job limit (235 runs ok, then cancelled), so the runs are
# split over 4 shards (`--shard N --of 4`, round robin, the parity coverage report in shard 1). The matrix jobs are
# named windows-crew (shard N); the job `windows-crew` below waits for all of them and fails unless every shard
# passed, so one stable check name can be required.
# The shards never run on a push to main (TR-1235). They run when a release tag `v*` is pushed (rc included), beside the
# release, which does not wait for them; when someone runs this workflow by hand on any ref; and on a PR that carries the
# label `windows-crew` (at once, and again on every later push, until the label is removed). A PR without the label
# still gets the `windows-crew` check: the shards are skipped and the check is green, so it can stay a required check.
# The runner is tests/ci_windows.py: it runs the tests/test_crew_*.py, test_ci_windows.py and the parity scenarios, and fails
# if it ran no test, if a test printed no summary, or (--floors) if a test passed fewer checks than its floor (TR-976).
name: windows-crew

on:
  # No paths-ignore: the required `windows-crew` check must be reported on every PR, a docs-only one included.
  # Another label than windows-crew on a PR that has it runs the shards again (the check must say what the head's
  # shards did); on a PR without it, the run is the quick skip.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-crew-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Do the shards run? A release tag and a manual run: yes. A PR: only with the label `windows-crew`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if tr ',' '\n' <<<"$LABELS" | grep -qx 'windows-crew'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no windows-crew label: the Windows shards are skipped (gh pr edit --add-label windows-crew, or run the workflow by hand)"
          fi

  shard:
    name: windows-crew (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      # A person's profile folder can hold a space and a letter outside ASCII (C:\Users\Jane Do + e-acute). HOME, USERPROFILE
      # and the temp folders point at one for every step after this, so a path that breaks on either breaks here.
      # The e-acute is built from its code point so this file stays ASCII.
      - name: Profile folder with a space and a non-ASCII letter
        shell: pwsh
        run: |
          $dir = 'C:\Users\runneradmin\Jane Do' + [char]0xE9
          New-Item -ItemType Directory -Force -Path $dir, "$dir\tmp" | Out-Null
          "USERPROFILE=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$dir\tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$dir\tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "profile folder: $dir"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install
        shell: pwsh
        run: |
          uv venv
          uv pip install -e .
      # FACTORY_CREW_HOME is the crew's own folder under that profile, so every path the engine builds from it has the
      # space and the e-acute in it. Tests that make their own crew home override it; the ones that read the
      # environment get this one.
      - name: Crew tests and parity (shard ${{ matrix.shard }} of 4)
        shell: pwsh
        env:
          FACTORY_CREW_HOME: ${{ env.USERPROFILE }}\factory
        run: |
          .venv\Scripts\activate.ps1
          python tests/ci_windows.py --floors --timeout 1200 --shard ${{ matrix.shard }} --of 4

  # The one check to require: green when all four shards are, and green when they were skipped on purpose
  # (a PR without the windows-crew label). A shard that failed, was cancelled, or was skipped by
  # accident (the `changes` job failed) is red.
  windows-crew:
    name: windows-crew
    needs: [changes, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "windows-crew: the changes job $CHANGES"
            exit 1
          fi
          if [ "$RUN" = "true" ]; then
            if [ "$SHARDS" != "success" ]; then
              echo "windows-crew shards: $SHARDS"
              exit 1
            fi
          elif [ "$SHARDS" != "skipped" ]; then
            echo "windows-crew shards: $SHARDS, expected skipped"
            exit 1
          else
            echo "windows-crew: no shard needed for this PR"
          fi
