# The crew tests and the parity harness on Windows, from the first milestone (TR-1066), so a Windows
# break shows up in the PR that causes it. Its own workflow, so ci.yml stays as it is.
# One run of everything took longer than the 60 minute job limit (235 runs ok, then cancelled), so the runs are
# split over 4 shards (`--shard N --of 4`, round robin, the parity coverage report in shard 1). The matrix jobs are
# named windows-crew (shard N); the job `windows-crew` below waits for all of them and fails unless every shard
# passed, so one stable check name can be required.
# A PR runs the shards only when it changes the crew engine or what it runs on (the `changes` job below), and not
# while it is a draft: marking it ready (ready_for_review) runs them once (TR-1233). A push to main runs them, except
# when it merges a PR whose same tree already passed them (TR-1234); the job `windows-crew` then names that PR run.
# The runner is tests/ci_windows.py: it runs the tests/test_crew_*.py, test_ci_windows.py and the parity scenarios, and fails
# if it ran no test, if a test printed no summary, or (--floors) if a test passed fewer checks than its floor (TR-976).
name: windows-crew

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: windows-crew-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Does this PR need the Windows run? A manual run: yes. A push to main: yes, unless the merged tree already passed
  # these shards on its PR (scripts/ci_covered.py, TR-1234; any doubt means yes). A draft PR: no. Any other PR: yes
  # when it changes the crew engine, its tests, the harness or this workflow.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      note: ${{ steps.covered.outputs.note }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: covered
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/ci_covered.py --workflow windows-crew.yml --marker "windows-crew (shard" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          COVERED: ${{ steps.covered.outputs.covered }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$COVERED" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "already tested on its PR: the Windows shards are skipped"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "a draft PR: the Windows shards run when it is marked ready"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if grep -qE '^(tares/crew/|claude-plugin/|tests/factory/|tests/test_crew_|tests/_crew_|tests/_env\.py$|tests/test_ci_windows\.py$|tests/ci_windows\.py$|tares/cli\.py$|tares/login\.py$|tares/__init__\.py$|pyproject\.toml$|\.github/workflows/windows-crew\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no crew engine change: the Windows shards are skipped"
          fi

  shard:
    name: windows-crew (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      # A person's profile folder can hold a space and a letter outside ASCII (C:\Users\Jane Do + e-acute). HOME, USERPROFILE
      # and the temp folders point at one for every step after this, so a path that breaks on either breaks here.
      # The e-acute is built from its code point so this file stays ASCII.
      - name: Profile folder with a space and a non-ASCII letter
        shell: pwsh
        run: |
          $dir = 'C:\Users\runneradmin\Jane Do' + [char]0xE9
          New-Item -ItemType Directory -Force -Path $dir, "$dir\tmp" | Out-Null
          "USERPROFILE=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$dir\tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$dir\tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "profile folder: $dir"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install
        shell: pwsh
        run: |
          uv venv
          uv pip install -e .
      # FACTORY_CREW_HOME is the crew's own folder under that profile, so every path the engine builds from it has the
      # space and the e-acute in it. Tests that make their own crew home override it; the ones that read the
      # environment get this one.
      - name: Crew tests and parity (shard ${{ matrix.shard }} of 4)
        shell: pwsh
        env:
          FACTORY_CREW_HOME: ${{ env.USERPROFILE }}\factory
        run: |
          .venv\Scripts\activate.ps1
          python tests/ci_windows.py --floors --timeout 1200 --shard ${{ matrix.shard }} --of 4

  # The one check to require: green when all four shards are, and green when they were skipped on purpose
  # (a draft or a PR that changes nothing the shards test). A shard that failed, was cancelled, or was skipped by
  # accident (the `changes` job failed) is red.
  windows-crew:
    name: windows-crew
    needs: [changes, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          NOTE: ${{ needs.changes.outputs.note }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "windows-crew: the changes job $CHANGES"
            exit 1
          fi
          if [ "$RUN" = "true" ]; then
            if [ "$SHARDS" != "success" ]; then
              echo "windows-crew shards: $SHARDS"
              exit 1
            fi
          elif [ "$SHARDS" != "skipped" ]; then
            echo "windows-crew shards: $SHARDS, expected skipped"
            exit 1
          elif [ -n "$NOTE" ]; then
            echo "windows-crew: no shard needed, $NOTE"
          else
            echo "windows-crew: no shard needed for this PR"
          fi
