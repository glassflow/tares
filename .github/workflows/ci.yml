# Build the console, run the backend tests against it, and scan for secrets — on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # a cell's state in Postgres (TARES_STATE_DSN): test_state_postgres moves a store into it
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Console — typecheck + build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build          # produces ui/dist, which the daemon serves and the wheel bundles
        working-directory: ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend — install + tests
        run: |
          pip install -e ".[postgres-state]"
          export TARES_TEST_PG=postgresql://postgres:pg@localhost:5432/postgres
          for t in $(grep -vE '^\s*(#|$)' tests/ci_list.txt); do
            echo "== $t =="
            python "tests/$t.py"
          done
      - name: Factory CLI — tests (bash, against a real Tares)
        run: |
          for t in $(grep -vE '^\s*(#|$)' tests/factory/ci_list.txt); do
            echo "== factory $t =="
            bash "tests/factory/${t}_test.sh"
          done

  # The same tests with every cell's state in Postgres (TARES_STATE_DSN), as a cloud cell keeps it:
  # tests/pg_harness gives each Store its own schema. In parallel with the DuckDB run above.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Console build (the daemon serves ui/dist)
        run: |
          npm ci
          npm run build
        working-directory: ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend — tests with the state in Postgres
        run: |
          pip install -e ".[postgres-state]"
          export TARES_TEST_PG=postgresql://postgres:pg@localhost:5432/postgres
          export PYTHONPATH="$PWD/tests/pg_harness"
          for t in $(grep -vE '^\s*(#|$)' tests/ci_list.txt | grep -vxE 'test_state_postgres|test_duckdb_memory'); do
            echo "== $t (state in Postgres) =="
            python "tests/$t.py"
          done
      - name: Factory CLI — tests with the state in Postgres
        run: |
          export TARES_TEST_PG=postgresql://postgres:pg@localhost:5432/postgres
          export PYTHONPATH="$PWD/tests/pg_harness"
          for t in $(grep -vE '^\s*(#|$)' tests/factory/ci_list.txt); do
            echo "== factory $t (state in Postgres) =="
            bash "tests/factory/${t}_test.sh"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks via its Docker image — the gitleaks-action needs a paid license for org repos;
      # the tool itself is free.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --config=/repo/.gitleaks.toml
