# Build the console, run the backend tests against it, and scan for secrets — on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Console — typecheck + build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build          # produces ui/dist, which the daemon serves and the wheel bundles
        working-directory: ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend — install + tests
        run: |
          pip install -e .
          for t in test_labels test_normalize test_auth test_api_keys test_pricing test_agents test_catalog_sync test_cli test_usage test_slack test_slack_verify test_slack_ask test_degraded; do
            echo "== $t =="
            python "tests/$t.py"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks via its Docker image — the gitleaks-action needs a paid license for org repos;
      # the tool itself is free.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --config=/repo/.gitleaks.toml
