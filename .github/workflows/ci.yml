# Build the console, run the backend tests against it, and scan for secrets — on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # a cell's state in Postgres (TARES_STATE_DSN): test_state_postgres moves a store into it
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Console — typecheck + build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build          # produces ui/dist, which the daemon serves and the wheel bundles
        working-directory: ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend — install + tests
        run: |
          pip install -e ".[postgres-state]"
          export TARES_TEST_PG=postgresql://postgres:pg@localhost:5432/postgres
          for t in test_labels test_normalize test_auth test_api_keys test_pricing test_agents test_catalog_sync test_cli test_status test_usage test_slack test_slack_verify test_slack_finding_post test_slack_ask test_degraded test_loki test_projects test_project_timeline test_rius_rca test_rca_callback_anchor test_ingest_bypass_cooldown test_agent_stats test_agent_conclude test_schedule_trigger test_watch_escalate test_run_results test_model_provider test_openai_provider test_model_providers test_metrics test_ai_sre_demo test_seed test_session_flow test_challenger_workflow test_plugin_challenger test_clean_env test_tracing test_agent_runs_filter test_delete_cascade test_agent_build test_builder_flow test_http_poll test_agent_daily_cap test_skipped_write_back test_projects_activity test_projects_unit_upgrade test_upgrade_hard_stop test_startup_fill test_skills test_handoffs test_project_keys test_goal_first test_setup_flow test_resources test_wiring test_github_credentials test_github_app test_cloud_connect test_docs test_linear test_github_tickets test_factory_mcp test_session_project test_pickup test_factory_plan test_factory_crew test_factory_ledger test_crew_standup test_factory_build test_factory_review test_factory_builder test_factory_repomap test_factory_desk test_factory_repos test_factory_setup test_factory_takeover test_mcp_station_headers test_login test_homebrew_formula test_claude_usage test_factory_batching test_state_postgres; do
            echo "== $t =="
            python "tests/$t.py"
          done
      - name: Factory CLI — tests (bash, against a real Tares)
        run: |
          for t in parse guard heavy tidy spec session tares crew usage freeze idle_wake pace claude_update lsp; do
            echo "== factory $t =="
            bash "tests/factory/${t}_test.sh"
          done

  # The same tests with every cell's state in Postgres (TARES_STATE_DSN), as a cloud cell keeps it:
  # tests/pg_harness gives each Store its own schema. In parallel with the DuckDB run above.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Console build (the daemon serves ui/dist)
        run: |
          npm ci
          npm run build
        working-directory: ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend — tests with the state in Postgres
        run: |
          pip install -e ".[postgres-state]"
          export TARES_TEST_PG=postgresql://postgres:pg@localhost:5432/postgres
          export PYTHONPATH="$PWD/tests/pg_harness"
          for t in test_labels test_normalize test_auth test_api_keys test_pricing test_agents test_catalog_sync test_cli test_status test_usage test_slack test_slack_verify test_slack_finding_post test_slack_ask test_degraded test_loki test_projects test_project_timeline test_rius_rca test_rca_callback_anchor test_ingest_bypass_cooldown test_agent_stats test_agent_conclude test_schedule_trigger test_watch_escalate test_run_results test_model_provider test_openai_provider test_model_providers test_metrics test_ai_sre_demo test_seed test_session_flow test_challenger_workflow test_plugin_challenger test_clean_env test_tracing test_agent_runs_filter test_delete_cascade test_agent_build test_builder_flow test_http_poll test_agent_daily_cap test_skipped_write_back test_projects_activity test_projects_unit_upgrade test_upgrade_hard_stop test_startup_fill test_skills test_handoffs test_project_keys test_goal_first test_setup_flow test_resources test_wiring test_github_credentials test_github_app test_cloud_connect test_docs test_linear test_github_tickets test_factory_mcp test_session_project test_pickup test_factory_plan test_factory_crew test_factory_ledger test_crew_standup test_factory_build test_factory_review test_factory_builder test_factory_repomap test_factory_desk test_factory_repos test_factory_setup test_factory_takeover test_mcp_station_headers test_login test_homebrew_formula test_claude_usage test_factory_batching; do
            echo "== $t (state in Postgres) =="
            python "tests/$t.py"
          done
      - name: Factory CLI — tests with the state in Postgres
        run: |
          export TARES_TEST_PG=postgresql://postgres:pg@localhost:5432/postgres
          export PYTHONPATH="$PWD/tests/pg_harness"
          for t in parse guard heavy tidy spec session tares crew usage freeze idle_wake pace claude_update lsp; do
            echo "== factory $t (state in Postgres) =="
            bash "tests/factory/${t}_test.sh"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks via its Docker image — the gitleaks-action needs a paid license for org repos;
      # the tool itself is free.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --config=/repo/.gitleaks.toml
