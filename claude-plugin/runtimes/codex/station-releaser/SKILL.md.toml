# The releaser's manual as a Codex station reads it: edits of ../../../skills/station-releaser/SKILL.md (TR-1599).
#
# A Codex releaser has no schedule: the factory wakes it for a RELEASE (a message, delivered once, kept while it is
# stopped, or a RELEASE line in the orchestrator's report) and after quiet.

[[edit]]
find = '''1. Load `factory-protocol` if you haven't.'''
with = '''1. The factory protocol is above; nothing has to be loaded.'''

[[edit]]
find = '''4. Arm a schedule with `CronCreate` every 30 minutes, prompt `Releaser tick: read the orchestrator's report (a short state file) and look only at its Undelivered section; take a RELEASE for you there that your report does not already list under Taken, put it there and tell the orchestrator; otherwise end the turn.` Never reword a RELEASE line in Undelivered, the watch keys it by the line's text. Check `CronList` first so you never hold two. Without it Claude Code stops you after about an hour idle, and a `RELEASE` sent while you are stopped is lost. Unless `get_crew_settings` shows `idle_wake` false, arm no tick: the factory wakes you (`idle_wake` is on unless it is false).'''
with = '''4. You hold no schedule: the factory wakes you when a `RELEASE` reaches you (a message, which is kept while you are stopped and delivered once) and when one for you is under Undelivered in the orchestrator's report, and after quiet. On each wake read the orchestrator's report (a short state file) and look only at its Undelivered section; take a RELEASE for you there that your report does not already list under Taken, put it there and tell the orchestrator; otherwise end the turn. Never reword a RELEASE line in Undelivered, the watch keys it by the line's text.'''
