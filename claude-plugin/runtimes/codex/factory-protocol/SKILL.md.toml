The first line is what your person sees in the preview, so it carries the type, the gist and the ticket ref (Tares shows a message on the ticket it names):'''
with = '''Send with the Tares tool `send_to_station(to, message)` to a station's exact name (`$FACTORY_ORCHESTRATOR`, `$FACTORY_CREW-reviewer`, `$FACTORY_CREW-releaser`, a builder's name from `tares factory roster`). The factory hands it over between that station's turns, keeps it while that station is stopped, and delivers it once; the call returns at once. A name that doesn't resolve: run the roster; never guess.

