- **After a compaction** your skills are re-attached: load one again only if its copy ends "skill content truncated for compaction" (Read the whole file) or a rule is missing. Pages are not re-attached: Read one when needed. **After a revive** load both, as your hook says. Then re-read your report and Tares, and check `CronList` (re-arm if missing and `idle_wake` is off).
- With `idle_wake` on (the default), the watch holds the tick: arm no `CronCreate`. It wakes you once'''
