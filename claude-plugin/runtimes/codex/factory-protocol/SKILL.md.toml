[[edit]]
find = '''13. **A permission check denies an action**: don't retry it another way or hand it to a peer. Write the exact command to your report, verbatim, and tell the orchestrator your station name and that command, word for word. Your person can allow it in the console; the factory then restarts you, in the same conversation, with the grant, and says so: run the command again if still needed.'''
with = '''13. **A permission check denies an action.** Two things refuse a command on Codex, and each is answered its own way:
   - **Your sandbox** refuses what needs the network or writes outside your workspace (`Operation not permitted`, a fetch or a push that cannot connect, a `tares factory` command that says Tares does not answer: Tares is up, your sandbox has no network): run the same command again and ask for approval (escalated permissions, with a one-line reason). The request reaches your person's desk, and you go on when they answer. Declined: don't retry it another way.
   - **The factory's guard** refuses with the factory's reason: don't retry it another way or hand it to a peer. Write the exact command to your report, verbatim, under `## Waiting on`. If a ticket cannot go on without it, `set_stage(ticket, "blocked", reason=...)` with your station name and that command, word for word, so it reaches the desk.'''

[[edit]]
find = '''- **Other crews are not reachable by message.** `SendMessage` reaches only your crew; between crews Tares is the only channel (the ticket, its working doc, the desk).'''
with = '''- **Other crews are not reachable by message.** `send_to_station` reaches only your crew; between crews Tares is the only channel (the ticket, its working doc, the desk).'''

