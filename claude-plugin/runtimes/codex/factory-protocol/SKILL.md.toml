with = '''Only the orchestrator writes the desk. From a Codex station a question reaches it through the ticket it is about: `set_stage(ticket, "blocked", reason=...)` puts that ticket on the desk for its assignee, with your reason as the question. When someone else should answer (the repo's area owner from `list_areas`, else the project lead), name them in the reason.'''

