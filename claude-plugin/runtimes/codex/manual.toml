# What a station on Codex is told (TR-1598). The rules have one source, the skills next door
# (../../skills); this folder holds only what a Codex station must be told differently, because it has no
# skills, no subagents, no schedule of its own and no slash commands; it messages a station with the Tares tool `send_to_station`.
# tares/crew/role_text.py renders it, and tests/test_role_text.py holds the two together.
#
# A role gets a manual on Codex by a [roles.<role>] table here: `parts` are the skills files that make it,
# `pages` the ones it names and reads when needed. A file that names something only Claude Code has needs
# an edits file, <skill>/<file>.toml: [[edit]] tables with `find` (a passage of the file, there exactly
# once) and `with` (what a Codex station reads instead).

opening = '''
The plan, tickets, assumptions, checks, reviews and the desk are on Tares, through the tools of the MCP server `tares`. Your operating rules follow: the factory protocol, your role's manual, then the pages they name. They are part of your instructions: nothing has to be loaded, and they stay with you after a compaction. After a compaction, and when the factory says it revived or restarted you, read your report (page `report.md`) and your work on Tares, then carry on where your report left off.

You run on Codex. You have no schedule of your own and nobody to hand work to; you send another station of your crew a message with the Tares tool `send_to_station`. Where a rule below says what a station does instead, do that; never look for another route.
'''

[roles.builder]
parts = ["factory-protocol/SKILL.md", "station-builder/SKILL.md"]
pages = ["factory-protocol/report.md", "factory-protocol/older-tares.md", "station-builder/stop.md",
         "station-builder/screen-ticket.md"]
