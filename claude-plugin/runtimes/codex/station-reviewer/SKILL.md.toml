[[edit]]
find = '''7. **Second-model challenge.** Give a subagent on a different Claude model from yours (`model: "sonnet"` if you run on Opus, `"opus"` if you run on Sonnet) the diff, the ticket and your draft findings, and ask it to find what you missed and to argue against each finding. Keep what survives. `crew.json` → `review.challenge = false` skips this for trivial PRs.'''
with = '''7. **Second look, in a fresh session.** Write the diff (`git diff <base>...<sha>` in your worktree), the ticket's goal and your draft findings to a file, and run `tares factory second-look --file <that file> --dir <your worktree>`, asking for approval (it reaches the model over the network). It is a separate Codex session that starts from nothing but that file, read-only: ask it to find what you missed and to argue against each finding, and keep what survives. It is the same model as yours unless the crew names another (`stations.reviewer.second_look_model`); its answer says which. Write in the review what it was ("second look: a separate Codex session on <model>"), never a second model's when it was not. `crew.json` → `review.challenge = false` skips this for trivial PRs.'''

