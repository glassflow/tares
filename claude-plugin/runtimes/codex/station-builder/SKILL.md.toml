#
# How a Codex builder reports (TR-1598): through Tares first, and with messages (send_to_station, TR-1599).
# State and results are the ticket's (its stage, its checks, its working doc's Progress) and the station's
# report. A question that blocks goes to the desk by blocking the ticket (`set_stage` with a reason, which
# Tares puts on the desk); one that does not is an assumption. A review is asked for by the stage alone.

