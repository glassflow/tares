find = '''- Missing information the plan should have had: `ASK` the orchestrator with your recommendation. If it's not blocking, assume and continue.
- A question about the ticket (what it should do, a choice the working doc leaves open) is for the ticket's assignee, normally your person: `ASK` with the ticket ref and, when it is not your person, `to:` their email or person id (the ticket's assignee as `get_ticket` shows it), and the orchestrator puts it on the desk addressed to them (only it writes the desk). A mismatch with a dependency built by another crew (the route, field names or version that differ from what you were told) goes the same way with `to:` that dependency ticket's assignee; name the route, the field names or the version in the question. Other crews cannot be messaged: the desk is how they hear.
- A test or build you can't make pass after two honest attempts: log what you tried (`tares factory report log`), `set_stage(ticket, "blocked", reason=...)`, `ASK` with `blocking: yes`. Write the reason for a person: Tares shows it on the desk until your `ASK` arrives.
- A permission denial: don't work around it. Put the exact command, verbatim, under `## Waiting on` in your report and tell the orchestrator your station name and that command, word for word (protocol rule 13).'''
with = '''- Missing information the plan should have had: if it's not blocking, assume and continue (`assume`). If it blocks, `set_stage(ticket, "blocked", reason=...)` with the question, the options and your recommendation: Tares puts the ticket on the desk with that reason.
- A question about the ticket (what it should do, a choice the working doc leaves open) is for the ticket's assignee, normally your person: blocking the ticket puts it on the desk for them. A mismatch with a dependency built by another crew (the route, field names or version that differ from what you were told) goes the same way; name the dependency's ticket and the route, the field names or the version in the reason. Other crews cannot be messaged: the desk is how they hear.
- A test or build you can't make pass after two honest attempts: log what you tried (`tares factory report log`), then `set_stage(ticket, "blocked", reason=...)`. Write the reason for a person: Tares shows it on the desk.
- A permission denial: don't work around it. Put the exact command, verbatim, under `## Waiting on` in your report (protocol rule 13); when the ticket cannot go on without it, block the ticket with your station name and that command, word for word, as the reason.'''

