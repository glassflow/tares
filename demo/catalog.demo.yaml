# Tares catalog for the demo stack (demo/docker-compose.yml).
# Prometheus on :9090 (metrics + alerting rules), logs via docker. Everything is keyed `api-server`,
# so logs, metrics, and the alerts Prometheus fires correlate in one timeline.
#
# The division of labour is the real one: Prometheus evaluates the alerting rules and fires; Tares
# ingests those alerts, correlates them with the metrics and logs, and a trigger wakes a subscribed
# agent with the whole timeline — Tares diagnoses, it doesn't re-implement alerting.
#
# Works from any directory (the logs source tails the container by its fixed name):
#   curl -O https://raw.githubusercontent.com/glassflow/tares/main/demo/catalog.demo.yaml
#   TARES_CATALOG=catalog.demo.yaml tares up

sources:
  # Prometheus metrics — context in the timeline (the signals behind the alert). Values ride on the
  # `value` number label so they show in Fields (and could drive their own triggers if you wanted).
  - name: demo_metrics
    connector: prometheus
    poll: 5s
    config:
      url: http://localhost:9090
      queries:
        - promql: 'sum(rate(http_requests_total{status=~"5.."}[1m])) by (service)'
          event_type: 5xx_rate
          text: "5xx rate {service}={val}/s"
        - promql: 'histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket[2m])) by (le, service))'
          event_type: p99
          text: "p99 {service}={val}ms"
        - promql: 'db_connections_active'
          event_type: db_active
          text: "db connections active={val}"
        - promql: 'dependency_up'
          event_type: dependency
          text: "dependency {dependency} up={val}"
      labels:
        - { name: service, const: api-server, primary: true }   # one service in the demo — key everything to it
        - { name: value, field: value, type: number }           # the metric value, aggregatable

  # Container logs — one line per request.
  - name: demo_logs
    connector: docker_logs
    poll: 5s
    config:
      container: tares-demo-api-server   # fixed container_name in docker-compose.yml
      labels:
        - { name: service, const: api-server, primary: true }   # same key as metrics/alerts, and a real label

  # The alerts Prometheus's own rules have fired (polls /api/v1/alerts — no Alertmanager needed).
  - name: demo_alerts
    connector: prometheus_alerts
    poll: 10s
    config:
      url: http://localhost:9090
      labels:
        - { name: service, field: labels.service, primary: true }   # the rule sets service=api-server
        - { name: alertname, field: labels.alertname }
        - { name: severity, field: labels.severity }
        - { name: state, field: state }
        - { name: alert_active, const: 1, type: number }            # 1 per alert event — lets the trigger react to alerts

triggers:
  # Wake the agent when Prometheus fires an alert, reacting to the alert, not re-thresholding the
  # metric. `alert_active` is 1 on every alert event, so its sum over the window is the alert count;
  # grouping by key_value keeps the dispatched payload the full correlated timeline for api-server,
  # read across all three sources.
  - name: incident
    sources: [demo_logs, demo_metrics, demo_alerts]
    key_field: service
    condition:
      aggregate: sum
      field: alert_active
      predicate: "> 0"
      window: 1m
      group_by: [key_value]
    emit:
      kind: incident
      context_window: 15m
    cooldown: 5m

agents:
  # A Tares agent shipped with the demo — the loop closes with nothing to deploy. When the
  # `incident` trigger fires it reads the correlated timeline (the fired alert plus the signals
  # behind it and the request logs) and writes a finding onto api-server's timeline. It's a real
  # agent, so it needs an Anthropic key: export ANTHROPIC_API_KEY before `tares up` (or set one in
  # the console -> Settings). Without a key the run is logged as "no key" and no finding is written.
  # Enabled here (= subscribed to the trigger); disable it on the trigger's page any time.
  - name: incident-first-look
    trigger: incident
    enabled: true
    prompt: |
      You are an SRE taking the first look when Prometheus fires an alert on api-server. You are
      handed the correlated timeline: the firing alert (HighErrorRate / HighLatency / DependencyDown)
      plus the signals behind it (5xx request rate, p99 latency, active DB connections, dependency
      health) and the service's request logs. That is your evidence.

      Produce a tight incident note: (1) what is failing and since when, (2) the most likely cause,
      tied to the specific evidence lines (which signal crossed, what the logs show), (3) a suggested
      next action. If the timeline is too narrow, read a wider window (1h) once before concluding. Do
      not speculate beyond the evidence; if it's inconclusive, say what you'd look at next.
