[project]
name = "tares"
version = "1.56.0"
description = "Open-source platform for always-on AI agents: a software factory for Claude Code that takes your projects from tickets to merged pull requests, or an AI SRE that watches your systems."
readme = "README.md"
keywords = ["tares", "software-factory", "claude-code", "autonomous-agents", "coding-agents", "multi-agent", "agent-orchestration", "ai-sre", "ai-monitoring", "incident-response", "observability", "mcp"]
license = "MIT AND LicenseRef-Tares-EE"
license-files = ["LICENSE", "ee/LICENSE"]
authors = [{ name = "GlassFlow" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "pydantic>=2",
    "mcp>=1.2,<2",   # 2.0 renamed FastMCP->MCPServer and dropped mcp.server.fastmcp (see mcp_server.py)
    "pytz>=2024.1",   # DuckDB needs it to bind tz-aware datetimes to TIMESTAMPTZ
    "asyncpg>=0.29",  # Postgres connector driver — base so the connector works on `tares up`
    "anthropic>=0.40",  # console Ask/Organize agent — base so it works on `tares up`
    # Agent tracing (tracing.py): OTLP/HTTP export of agent runs to Rius, Langfuse, a collector.
    # Base so the console switch works on `tares up`; the http exporter is pure Python.
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    # /metrics (metrics.py): Prometheus text format for the daemon's own counters. Pure Python and
    # small, so base: a fleet scrapes every cell without an extra to remember.
    "prometheus-client>=0.20",
    "cryptography>=42",  # Ed25519 licence check, tares/licence.py
    # The crew engine (tares.crew) reads process state and stops stale station processes with psutil.
    "psutil>=5.9",
    "keyring>=24",  # tares login keeps the key in the OS keychain (tares/login.py); a file is the fallback
]

# Tests only: tares.crew's JSON schemas are checked with it. Not a runtime dependency.
[dependency-groups]
dev = ["jsonschema>=4"]

[project.urls]
Homepage = "https://www.glassflow.ai/tares"
Documentation = "https://docs.glassflow.ai/tares"
Repository = "https://github.com/glassflow/tares"

[project.optional-dependencies]
# OTLP gRPC receiver (:4317). The OTLP/HTTP JSON receiver needs none of this; grpcio is a heavy
# compiled dep, so the gRPC path stays opt-in. (postgres/agent deps are now base — `tares up`
# ships a working Postgres connector and Ask agent with no extras.)
otlp-grpc = ["grpcio>=1.60", "opentelemetry-proto>=1.20"]
# A cell's state in Postgres (TARES_STATE_DSN, state_db.py): the cloud image installs it; a
# local install keeps its state in DuckDB and needs none of this.
postgres-state = ["psycopg[binary]>=3.1"]

# The enterprise code is loaded through the `tares.ee` entry point group (tares/team.py). Core
# never imports it; with no valid licence the cell uses SingleTeam instead.
[project.entry-points."tares.ee"]
team = "tares_ee.team:Team"

# The built-in integrations register the way a package installed next to Tares does. The registry
# also lists them itself (BUILTINS), so a source checkout works before a reinstall; the same class
# twice is ignored.
[project.entry-points."tares.integrations"]
"tickets.tares" = "tares.integrations.builtin.tickets_tares:TicketsTares"
"tickets.linear" = "tares.integrations.builtin.tickets_linear:TicketsLinear"
"tickets.github" = "tares.integrations.builtin.tickets_github:TicketsGithub"

[project.scripts]
tares = "tares.cli:main"
taresd = "tares.cli:run_daemon"
tares-mcp = "tares.cli:run_mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The console is a build artifact (ui/dist is gitignored) — include it in the sdist too, so the
# wheel can be rebuilt from the sdist (uv build → sdist → wheel).
[tool.hatch.build]
artifacts = ["ui/dist/**"]

[tool.hatch.build.targets.sdist]
# hatch reads only the root .gitignore, so ui/.gitignore's node_modules would land in the sdist,
# hard links (esbuild's binary) included, which uv refuses to unpack when it builds the wheel
exclude = ["**/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["tares", "ee/tares_ee"]

# Ship the built console SPA inside the package (tares/console), so `pip install` serves the UI.
# Build the UI first: `cd ui && npm install && npm run build` emits ui/dist before the wheel build.
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "tares/console"
# The Claude Code plugin, so `tares factory` and its stations run from the install.
"claude-plugin" = "tares/claude-plugin"
# tares/crew/schemas/*.json is inside the tares package, so `packages = ["tares"]` above already
# ships it (hatch includes every file under a package, not only .py). tests/test_crew_packaging.py
# builds a wheel and checks that.
