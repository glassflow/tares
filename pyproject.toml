[project]
name = "tares"
version = "1.29.1"
description = "A self-hostable data plane for AI agents: ingest events, store them losslessly, and serve one correlated read of any entity over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GlassFlow" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "pydantic>=2",
    "mcp>=1.2,<2",   # 2.0 renamed FastMCP->MCPServer and dropped mcp.server.fastmcp (see mcp_server.py)
    "pytz>=2024.1",   # DuckDB needs it to bind tz-aware datetimes to TIMESTAMPTZ
    "asyncpg>=0.29",  # Postgres connector driver — base so the connector works on `tares up`
    "anthropic>=0.40",  # console Ask/Organize agent — base so it works on `tares up`
    # Agent tracing (tracing.py): OTLP/HTTP export of agent runs to Rius, Langfuse, a collector.
    # Base so the console switch works on `tares up`; the http exporter is pure Python.
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]

[project.urls]
Homepage = "https://tares-glassflow.com"
Documentation = "https://docs.glassflow.ai/tares"
Repository = "https://github.com/glassflow/tares"

[project.optional-dependencies]
# OTLP gRPC receiver (:4317). The OTLP/HTTP JSON receiver needs none of this; grpcio is a heavy
# compiled dep, so the gRPC path stays opt-in. (postgres/agent deps are now base — `tares up`
# ships a working Postgres connector and Ask agent with no extras.)
otlp-grpc = ["grpcio>=1.60", "opentelemetry-proto>=1.20"]

[project.scripts]
tares = "tares.cli:main"
taresd = "tares.cli:run_daemon"
tares-mcp = "tares.cli:run_mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The console is a build artifact (ui/dist is gitignored) — include it in the sdist too, so the
# wheel can be rebuilt from the sdist (uv build → sdist → wheel).
[tool.hatch.build]
artifacts = ["ui/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["tares"]

# Ship the built console SPA inside the package (tares/console), so `pip install` serves the UI.
# Build the UI first: `cd ui && npm install && npm run build` emits ui/dist before the wheel build.
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "tares/console"
